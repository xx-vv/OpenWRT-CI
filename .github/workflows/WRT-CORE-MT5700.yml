name: WRT-CORE-MT5700

on:
  workflow_call:
    inputs:
      WRT_CONFIG: { required: true, type: string }
      WRT_THEME: { required: true, type: string }
      WRT_NAME: { required: true, type: string }
      WRT_SSID: { required: true, type: string }
      WRT_WORD: { required: true, type: string }
      WRT_IP: { required: true, type: string }
      WRT_PW: { required: true, type: string }
      WRT_REPO: { required: true, type: string }
      WRT_BRANCH: { required: true, type: string }
      WRT_SOURCE: { required: true, type: string }
      WRT_PACKAGE: { required: false, type: string }
      WRT_TEST: { required: false, default: false, type: boolean }

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-22.04
    timeout-minutes: 345
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          allow-unsafe-pr-checkout: true

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          # 原作者建议：不做 full-upgrade，省去数分钟耗时的无用全量升级
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean
          
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/
          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          # 强制修正 toolchain 依赖顺序
          if ! grep -q 'tools/install' toolchain/Makefile; then
            sed -i 's|^$(curdir)//prepare = $(STAGING_DIR)/.prepared $(TOOLCHAIN_DIR)/info.mk$|$(curdir)//prepare = $(STAGING_DIR)/.prepared $(TOOLCHAIN_DIR)/info.mk tools/install|' toolchain/Makefile
            echo "Patched: toolchain/prepare now depends on tools/install"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      # ★ 借鉴原作者：缓存路径增加 host*，防止 host 工具丢失
      - name: Restore Build Cache (Toolchain & ccache)
        id: cache-tc-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-tc-${{env.WRT_HASH}}
          restore-keys: |
            ${{env.WRT_CACHE_PREFIX}}-tc-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/tool*
            ./wrt/staging_dir/host*

      - name: Restore Build Cache (Download Packages)
        id: cache-dl-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-dl-${{env.WRT_HASH}}
          restore-keys: |
            ${{env.WRT_CACHE_PREFIX}}-dl-
          path: |
            ./wrt/dl

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-tc-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-tc-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Setup rustup for mt5700 Rust backend
        if: ${{ !inputs.WRT_TEST }}
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-unknown-linux-musl
          rustup target list --installed | grep -qx aarch64-unknown-linux-musl
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          {
            echo "CARGO_HOME=$HOME/.cargo"
            echo "RUSTUP_HOME=$HOME/.rustup"
            echo "RUSTFLAGS=-C link-self-contained=yes -C linker=rust-lld"
          } >> "$GITHUB_ENV"

      - name: Custom Settings
        run: |
          cd ./wrt/
          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL-5700.txt >> .config
          fi
          $GITHUB_WORKSPACE/Scripts/Settings.sh
          
          make defconfig -j$(nproc)
          # 保护 staging_dir 不被清理
          rm -rf ./build_dir ./bin

      - name: Verify luci-app-mt5700 selected
        run: |
          cd ./wrt/
          if [ ! -d ./package/luci-app-mt5700 ]; then
            echo "::error::package/luci-app-mt5700 不存在"
            exit 1
          fi
          if ! grep -qx 'CONFIG_PACKAGE_luci-app-mt5700=y' ./.config; then
            echo "::error::.config 未选中 luci-app-mt5700"
            exit 1
          fi

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make download -j$(nproc) || make download -j1

      # ★ 借鉴原作者：下载完立刻存 dl 缓存，哪怕后面编译超时也不亏
      - name: Save Build Cache (Download Packages)
        if: ${{ always() && !inputs.WRT_TEST && steps.cache-dl-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-dl-${{env.WRT_HASH}}
          path: |
            ./wrt/dl

      - name: Compile luci-app-mt5700 (verbose)
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make package/luci-app-mt5700/compile -j1 V=s || true

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          export CCACHE_DIR="$(pwd)/.ccache"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=true
          ccache -z 2>/dev/null || true

          set +e -o pipefail
          make -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "首次并行编译失败（rc=$RC），降级为单线程 -j1 重试并追加日志"
            make -j1 V=s 2>&1 | tee -a build.log
            RC=${PIPESTATUS[0]}
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::group::编译失败诊断"
            ANN=$(mktemp)
            : > "$ANN"

            grep -E "ERROR: .*(trying to overwrite|unable to select packages|package version is invalid|breaks:|conflicts with|installed .* is newer)" build.log \
              | sort -u | head -n 6 >> "$ANN" || true
            grep -E "^(ERROR: |make(\\[[0-9]+\\])?: \*\*\* ).*(failed to build|Error [0-9]|too big)" build.log \
              | sort -u | head -n 4 >> "$ANN" || true
            grep -E "^make(\\[[0-9]+\\])?: \*\*\* .*(Error [0-9]|Stop)" build.log \
              | sort -u | head -n 4 >> "$ANN" || true

            if [ ! -s "$ANN" ]; then
              grep -E "^ERROR: " build.log | sort -u | head -n 8 >> "$ANN" || true
            fi

            if [ ! -s "$ANN" ]; then
              echo "::error::未匹配到包级错误行，输出日志末尾 30 行"
              tail -n 30 build.log
            else
              awk '!seen[$0]++' "$ANN" | head -n 12 | while IFS= read -r LINE; do
                [ -n "$LINE" ] && echo "::error::$LINE"
              done
              echo "--- 编译错误上下文 ---"
              grep -nE "error:|Error [0-9]+|collect2:|undefined reference|too big|trying to overwrite|unable to select packages|package version is invalid|breaks:" build.log \
                | head -n 30
            fi
            rm -f "$ANN"
            echo "::endgroup::"
          fi

          ccache -s 2>/dev/null || true
          exit "$RC"

      # ★ 借鉴原作者：使用 always() 抢救工具链缓存，防止被硬超时杀掉
      - name: Save Build Cache (Toolchain & ccache)
        if: ${{ always() && !inputs.WRT_TEST && steps.cache-tc-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-tc-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/tool*
            ./wrt/staging_dir/host*

      - name: Machine Information
        run: |
          cd ./wrt/
          lscpu | grep -E "name|Core|Thread"
          df -h
          du -h --max-depth=1

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/
          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            # ★ 借鉴原作者：强壮的命名与防冲突逻辑（已增强）
            # 安全化：把可能出现在文件名中的非法字符替换掉
            SAFE_NAME=$(echo "$WRT_NAME"   | tr '/ ' '__')
            SAFE_INFO=$(echo "$WRT_INFO"   | tr '/ ' '__')
            SAFE_BRANCH=$(echo "$WRT_BRANCH" | tr '/ ' '__')
            SAFE_TARGET=$(echo "$WRT_TARGET" | tr '/ ' '__')
            SAFE_WIFI="$WRT_WIFI"
            [ "$SAFE_WIFI" = "none" ] && SAFE_WIFI=""   # none 不参与命名
            SAFE_DATE="$WRT_DATE"

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              BASE=$(basename "$FILE")
              case "$BASE" in
                *.bin|*.img|*.gz|*.vmdk) ;;
                *) mv -f "$FILE" "./upload/$BASE"; continue ;;
              esac
              EXT=$(echo "$BASE" | cut -d '.' -f 2-)
              STEM="${BASE%.*}"
              case "$STEM" in
                *sysupgrade*)   TYPE=sysupgrade ;;
                *factory*)      TYPE=factory ;;
                *initramfs*)    TYPE=initramfs ;;
                *recovery*)     TYPE=recovery ;;
                *combined-efi*) TYPE=efi ;;
                *combined*)     TYPE=combined ;;
                *rootfs*)       TYPE=rootfs ;;
                *kernel*)       TYPE=kernel ;;
                *)              TYPE="" ;;
              esac

              # 组装基础名：只拼接非空字段，避免出现 "--" 或 "-none"
              PARTS=("$SAFE_NAME" "$SAFE_INFO" "$SAFE_BRANCH" "$SAFE_TARGET")
              [ -n "$SAFE_WIFI" ] && PARTS+=("$SAFE_WIFI")
              [ -n "$TYPE" ]      && PARTS+=("$TYPE")
              NEW_BASE=$(IFS='-'; echo "${PARTS[*]}")
              NEW_BASE="$NEW_BASE-$SAFE_DATE"

              NEW_FILE="$NEW_BASE.$EXT"
              if [ -e "./upload/$NEW_FILE" ]; then
                FS=$(echo "$STEM" | grep -ioE 'squashfs|ext4' | tail -n 1 || true)
                if [ -n "$FS" ] && [ ! -e "./upload/$NEW_BASE-$FS.$EXT" ]; then
                  NEW_FILE="$NEW_BASE-$FS.$EXT"
                else
                  SUFFIX=$(echo "$BASE" | md5sum | cut -c 1-6)
                  NEW_FILE="$NEW_BASE-$SUFFIX.$EXT"
                fi
              fi
              mv -f "$FILE" "./upload/$NEW_FILE"
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
            rm -rf ./build_dir ./bin
          fi

      - name: Release Firmware
        if: ${{ !inputs.WRT_TEST }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}"
          
          BODY=$(cat <<EOF
          这是个平台固件包，内含多个设备！
          请注意选择你需要的设备固件！
          不要问，刷就完事了！

          全系带开源硬件加速，别问了！

          源码：${{env.WRT_REPO}}
          分支：${{env.WRT_BRANCH}}
          提交：${{env.WRT_HASH}}

          配置：${{env.WRT_CONFIG}}
          平台：${{env.WRT_TARGET}}

          登录地址：${{env.WRT_IP}}
          登录密码：${{env.WRT_PW}}

          WIFI名称：${{env.WRT_SSID}}
          WIFI密码：${{env.WRT_WORD}}

          内核版本：${{env.WRT_KVER}}
          插件列表：${{env.WRT_LIST}}
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在（$TAG），追加产物"
          else
            gh release create "$TAG" --notes "$BODY"
          fi

          for f in ./wrt/upload/*.*; do
            [ -f "$f" ] || continue
            attempt=0
            until gh release upload --clobber "$TAG" "$f"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then
                echo "::error::上传失败（已重试 5 次）：$f"
                exit 1
              fi
              echo "上传 $f 失败（第 ${attempt} 次，5s 后重试）..."
              sleep 5
            done
          done

  # 缓存世代交替 Job 保持不变
  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail
          CURRENT_TC_KEYS=$(gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-tc-${GITHUB_SHA}" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          if [ -n "$CURRENT_TC_KEYS" ]; then
            gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-tc-" --ref "$GITHUB_REF" --limit 9999 --json id,key --jq '.[] | [.id, .key] | @tsv' |
              while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
                [ -n "$CACHE_ID" ] || continue
                [[ "$CACHE_KEY" == *"${GITHUB_SHA}"* ]] && continue
                gh cache delete "$CACHE_ID" --repo "$GH_REPO" || echo "warning: failed to delete cache $CACHE_ID"
              done
          fi

          CURRENT_DL_KEYS=$(gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-dl-${GITHUB_SHA}" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          if [ -n "$CURRENT_DL_KEYS" ]; then
            gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-dl-" --ref "$GITHUB_REF" --limit 9999 --json id,key --jq '.[] | [.id, .key] | @tsv' |
              while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
                [ -n "$CACHE_ID" ] || continue
                [[ "$CACHE_KEY" == *"${GITHUB_SHA}"* ]] && continue
                gh cache delete "$CACHE_ID" --repo "$GH_REPO" || echo "warning: failed to delete cache $CACHE_ID"
              done
          fi
