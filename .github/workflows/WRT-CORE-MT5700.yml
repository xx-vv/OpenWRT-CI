name: WRT-CORE-MT5700

on:
  workflow_call:
    inputs:
      WRT_CONFIG: { required: true, type: string }
      WRT_THEME: { required: true, type: string }
      WRT_NAME: { required: false, type: string, default: "" }
      WRT_SSID: { required: false, type: string, default: "" }
      WRT_WORD: { required: false, type: string, default: "" }
      WRT_IP: { required: false, type: string, default: "" }
      WRT_PW: { required: false, type: string, default: "" }
      WRT_REPO: { required: true, type: string }
      WRT_BRANCH: { required: true, type: string }
      WRT_SOURCE: { required: true, type: string }
      WRT_PACKAGE: { required: false, type: string }
      WRT_TEST: { required: false, default: false, type: boolean }

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    # 固定 runner 镜像：22.04 工具链较旧，若未来迁移到 24.04 需同步验证。
    runs-on: ubuntu-22.04
    # 兜底上限：正常构建约 40 分钟。2026-11-06 事故中 apt 下载退化把 job 拖到
    # 2.5 小时，最终 runner 被环境回收、日志也未上传。显式收束可让异常在可观测
    # 的时间窗内以失败告终，并保留日志。
    timeout-minutes: 345
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
      rust_lock_hash: ${{steps.rust-cache-key.outputs.rust_lock_hash}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # v7 起支持该 input；若实际版本报 "Unexpected input" 仅 warning、不失败。
          allow-unsafe-pr-checkout: true

      - name: Free Up Disk Space
        # GitHub runner 根盘预装 dotnet/android-sdk/ghc 等占用约 25GB，
        # filogic 全量编译 + ccache 需要 30GB 以上，先清理与编译无关的预装件。
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / /mnt 2>/dev/null || true

      - name: Select Apt Mirror
        # runner 镜像内置 /etc/apt/apt-mirrors.txt：azure(priority:1) → archive(2)
        # → security(3)。apt 只按优先级取第一个可用镜像，慢但没报错时不会自动
        # 降级。2026-11-06 事故就是 azure 镜像吞吐骤降到几十 kB/s。
        # 这里按实测吞吐在两者之间切换；吞吐正常时不改变任何现有配置。
        timeout-minutes: 5
        run: |
          probe() {
            local sp
            sp=$(curl -sSL -r 0-8388607 -o /dev/null --connect-timeout 10 --max-time 25 \
              -w '%{speed_download}' "$1" 2>/dev/null || true)
            echo "${sp:-0}" | cut -d. -f1
          }
          . /etc/os-release 2>/dev/null || true
          IDX="dists/${VERSION_CODENAME:-jammy}/universe/binary-amd64/Packages.xz"
          AZ=$(probe "http://azure.archive.ubuntu.com/ubuntu/${IDX}")
          ALT=$(probe "https://archive.ubuntu.com/ubuntu/${IDX}")
          AZ=${AZ:-0}
          ALT=${ALT:-0}
          echo "apt 批量吞吐实测（字节/秒）：azure=${AZ} archive=${ALT}"

          if [ "$AZ" -lt 300000 ] && [ "$ALT" -ge $((AZ * 2)) ] && [ "$ALT" -ge 300000 ]; then
            echo "azure 镜像吞吐低于阈值，切换为 archive.ubuntu.com 优先"
            printf '%s\t%s\n' \
              'https://archive.ubuntu.com/ubuntu/' 'priority:1' \
              'https://security.ubuntu.com/ubuntu/' 'priority:2' \
              'http://azure.archive.ubuntu.com/ubuntu/' 'priority:3' \
              | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sudo -E apt-get -yqq update
          else
            echo "镜像吞吐正常，保持 runner 默认镜像配置"
          fi

      - name: Initialization Environment
        # 正常 5~6 分钟。上限 60 分钟：上游退化必须尽快失败并留下日志，
        # 而不是像以前那样烧掉 1.5~2.5 小时后连日志都取不到。
        timeout-minutes: 60
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # apt 全局超时配置：覆盖本步骤及后续所有 apt 调用
          sudo tee /etc/apt/apt.conf.d/99marvis-timeouts >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          Acquire::ftp::Timeout "60";
          DPkg::Lock::Timeout "120";
          Dpkg::Use-Pty "0";
          EOF

          # apt 命令超时重试封装。
          # 关键：`timeout` 必须是 `sudo` 的子进程（sudo 在前），不能写成
          # `timeout ... sudo apt`。后者超时时只把信号发给 sudo 所在的进程组，
          # sudo 被 SIGKILL 后无法再转发信号，它拉起的 apt 会成孤儿继续跑并持有
          # /var/lib/dpkg/lock-frontend —— 后续每一次重试都卡在锁上。
          apt_retry() {
            local tmo="$1"; shift
            local i
            for i in 1 2 3; do
              sudo -E timeout --kill-after=30 "$tmo" apt-get -yqq \
                -o Dpkg::Options::=--force-confdef \
                -o Dpkg::Options::=--force-confold "$@" && return 0
              echo "apt $* 第 ${i} 次失败或超时（${tmo}s）" >&2
              pgrep -a apt || true
              sleep 10
            done
            return 1
          }

          apt_retry 300 purge firefox
          apt_retry 300 update
          # python3-venv / python3-distutils：Cross Compile Rust Backend 用 python3 -m venv
          # 装 ziglang，Ubuntu 22.04 的 python3 不依赖 venv；OpenWrt 部分 host 脚本需要 distutils。
          # gperf / libtool：部分包 host 工具链与 configure 脚本需要。
          apt_retry 900 install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git gperf jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev \
            libtool lld llvm ninja-build patch perl pkgconf python3 \
            python3-cryptography python3-dev python3-distutils python3-packaging \
            python3-pyelftools python3-setuptools python3-venv qemu-utils rsync \
            swig unzip wget xz-utils zlib1g-dev zstd
          sudo apt-get -yqq autoclean || true
          sudo apt-get -yqq clean || true

          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          # 记录 job 起始时间：Compile Firmware 用它把编译预算收敛到 job 上限之内
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/
          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: ${{ !inputs.WRT_TEST }}
        # 用 restore@v4 而非 actions/cache@v6：后者会在 job 结束时自动 save，
        # 与下面显式 Save Build Cache 用同一 key 会触发重复保存 warning。
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: ${{ !inputs.WRT_TEST }}
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skipped done!"
          else
            echo "caches missed!"
          fi

          if [ "${{ steps.check-cache.outputs.cache-hit }}" != 'true' ]; then
            # 只清理 toolchain/ccache 旧代际，排除 -dl- 前缀。
            # gh cache list --key 是前缀匹配：WRT_CACHE_PREFIX 同时命中
            #   prefix-<hash>（toolchain）与 prefix-dl-<hash>（源码包）。
            # 若在这里一并删除，下一次 Restore Build Cache (Download Packages)
            # 就会 miss，导致全量重下载源码包——正好抵消 dl 缓存的意义。
            # -dl- 旧代际由独立 job cache-rollover 负责清理。
            CACHE_LIST=$(gh cache list --json id,key --key "$WRT_CACHE_PREFIX" \
              --jq '.[] | select(.key | contains("-dl-") | not) | .id' 2>/dev/null)
            for CACHE_ID in $CACHE_LIST; do
              gh cache delete "$CACHE_ID"
            done

            echo "caches cleanup done!"
          fi

      - name: Restore Build Cache (Download Packages)
        id: cache-dl-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-dl-${{env.WRT_HASH}}
          restore-keys: |
            ${{env.WRT_CACHE_PREFIX}}-dl-
          path: |
            ./wrt/dl

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Smoke Test luci-app-mt5700
        # 在耗时编译前，对刚 clone 的 luci-app-mt5700 做结构校验、语法检查与
        # 上游回归测试。上游改坏、脚本语法错误、深度适配注入失效都在这里尽早
        # 暴露，而不是数小时后才在 Compile Firmware 里失败。
        run: |
          cd ./wrt/package/luci-app-mt5700

          echo "==> 结构校验（含本仓库深度适配注入）"
          test -f src/Makefile || { echo "::error::missing src/Makefile"; exit 1; }
          test -f src/rust/Cargo.toml || { echo "::error::missing src/rust/Cargo.toml"; exit 1; }
          test -f src/rust/Cargo.lock || { echo "::error::missing src/rust/Cargo.lock"; exit 1; }
          grep -q 'MT5700_PREBUILT_HOOK' src/Makefile || { echo "::error::src/Makefile 缺少预编译注入标记 MT5700_PREBUILT_HOOK"; exit 1; }
          grep -q 'at-webserver-rust' src/Makefile || { echo "::error::src/Makefile 缺少 at-webserver-rust 标识"; exit 1; }

          for SH in \
            root/etc/init.d/at-webserver \
            root/etc/uci-defaults/at-webserver \
            root/etc/hotplug.d/iface/99-at-webserver \
            root/etc/hotplug.d/usb/99-at-webserver \
            root/usr/libexec/at-webserver/on-uplink.sh; do
            test -f "$SH" || { echo "::error::missing file: $SH"; exit 1; }
            test -x "$SH" || { echo "::error::missing execute permission (+x): $SH"; exit 1; }
          done

          echo "==> Shell 语法检查"
          # 核心文件缺失必须失败：冒烟测试的意义就是尽早暴露克隆/注入失败，
          # 不能像 [ -f ] && 那样在文件缺失时静默返回 0。
          for SH in \
            root/etc/init.d/at-webserver \
            root/etc/uci-defaults/at-webserver \
            root/etc/hotplug.d/iface/99-at-webserver \
            root/etc/hotplug.d/usb/99-at-webserver \
            root/usr/libexec/at-webserver/on-uplink.sh; do
            test -f "$SH" || { echo "::error::missing $SH"; exit 1; }
            sh -n "$SH"
          done
          # 需要真机 uci 环境，仅做可选语法检查
          if [ -f tests/iface/interface-selection.sh ]; then
            sh -n tests/iface/interface-selection.sh
          fi

          echo "==> LuCI JavaScript 语法检查"
          find htdocs -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          echo "==> 前端解析与 ucode JSON 回归测试"
          for T in \
            apn-channel-test.js \
            ca-status-test.js \
            cellular-icon-test.js \
            parse-regression-test.js \
            pdp-addr-test.js \
            signal-chart-test.js \
            switch-rollback-test.js \
            tabmenu-test.js \
            ucode-json-test.js \
            mock-modem/temp-level-test.js; do
            test -f "tests/$T" || { echo "::error::missing tests/$T"; exit 1; }
            node "tests/$T"
          done

          echo "==> JSON 元数据校验"
          jq empty root/usr/share/luci/menu.d/luci-app-mt5700.json
          jq empty root/usr/share/rpcd/acl.d/luci-app-mt5700.json

          echo "==> 翻译编译校验"
          # 上游 po 存在重复 msgid，msgfmt --check 会判 fatal，但 luci.mk 打包
          # 实际用 po2lmo 编译 lmo，重复项被合并、编译正常。故用 feed 里的同一份
          # 源码现场构建 po2lmo，校验口径与真实打包完全一致。
          LUCI_SRC="../../feeds/luci/modules/luci-base/src"
          test -f "$LUCI_SRC/po2lmo.c"
          rm -rf /tmp/po2lmo-src && cp -a "$LUCI_SRC" /tmp/po2lmo-src
          (
            cd /tmp/po2lmo-src
            gcc -O2 -o lemon contrib/lemon.c
            ./lemon -q -l T=contrib/lempar.c lib/plural_formula.y
            gcc -O2 -I. -o /tmp/po2lmo-bin po2lmo.c lib/lmo.c lib/plural_formula.c
          )
          /tmp/po2lmo-bin po/zh_Hans/luci-app-mt5700.po /tmp/luci-app-mt5700.zh_Hans.lmo
          test -s /tmp/luci-app-mt5700.zh_Hans.lmo

          echo "luci-app-mt5700 package smoke test: ALL PASSED"

      - name: Custom Settings
        run: |
          cd ./wrt/
          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/CPE.txt >> .config
          fi
          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

          # 目标设备校验（防止 Profile 静默回退到 DEFAULT_PROFILE）
          # 「Target Profile」是单选 choice：MULTI_PROFILE=n 时生效符号为
          # CONFIG_TARGET_<target>_DEVICE_xxx；若 .config 未正确选中设备，
          # defconfig 会回退到 target.mk 的 DEFAULT_PROFILE，最终编译出错误机型。
          # 正则必须用 \S+ 而非 [A-Za-z0-9_]：TR3000 的设备名含 '-'（如
          # cudy_tr3000-256mb-v1），字符类不匹配会回溯失败、DEVICE_SYMBOL 为空，
          # 整个校验被静默跳过。
          DEVICE_SYMBOL=$(grep -oP '^CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_\S+(?==y)' \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" | head -1)
          if [ -n "$DEVICE_SYMBOL" ]; then
            if grep -q "^$DEVICE_SYMBOL=y$" .config || \
               grep -q "^CONFIG_TARGET_DEVICE_${DEVICE_SYMBOL#CONFIG_TARGET_}=y$" .config; then
              echo "目标设备已生效: $DEVICE_SYMBOL"
            else
              echo "::error::目标设备 $DEVICE_SYMBOL 未生效，当前 $(grep -m1 '^CONFIG_TARGET_PROFILE=' .config || echo 'CONFIG_TARGET_PROFILE 未设置')"
              exit 1
            fi
          else
            echo "::error::未能从 Config/$WRT_CONFIG.txt 解析出设备符号（CONFIG_TARGET_*_DEVICE_*=y），无法校验目标设备"
            exit 1
          fi

          # 模组插件互斥校验
          NEW_PLUGIN=$(grep -c '^CONFIG_PACKAGE_luci-app-mt5700=y$' .config || true)
          OLD_PLUGIN=$(grep -c '^CONFIG_PACKAGE_luci-app-mt5700m=y$' .config || true)
          if [ "$NEW_PLUGIN" -gt 0 ] && [ "$OLD_PLUGIN" -gt 0 ]; then
            echo "::error::同一配置同时启用了 luci-app-mt5700 与 luci-app-mt5700m；两者都独占模组 AT 串口，只能二选一"
            exit 1
          fi
          if [ "$NEW_PLUGIN" -ne 1 ] || [ "$OLD_PLUGIN" -ne 0 ]; then
            echo "::error::期望启用 luci-app-mt5700，实际新插件 $NEW_PLUGIN / 旧插件 $OLD_PLUGIN"
            exit 1
          fi
          if ! grep -q '^CONFIG_PACKAGE_luci-i18n-mt5700-zh-cn=y$' .config; then
            echo "::error::缺少配套语言包 luci-i18n-mt5700-zh-cn"
            exit 1
          fi
          echo "luci-app-mt5700 已选中，语言包已启用"

          if ! grep -q 'MT5700_PREBUILT_HOOK' ./package/luci-app-mt5700/src/Makefile; then
            echo "::error::Packages.sh 的 PREPARE_MT5700_PREBUILT 注入未生效"
            exit 1
          fi

          # 提取 MT5700 插件版本（供 Release body 展示），多路径 fallback
          MT5700_VERSION="unknown"
          for f in ./package/luci-app-mt5700/Makefile ./package/luci-app-mt5700/src/Makefile; do
            if [ -f "$f" ]; then
              V=$(grep -oP '^PKG_VERSION:=\K.*' "$f" 2>/dev/null | head -1)
              if [ -n "$V" ]; then MT5700_VERSION="$V"; break; fi
            fi
          done
          echo "MT5700_VERSION=$MT5700_VERSION" >> "$GITHUB_ENV"

          # 原 make clean 会删除整个 staging_dir（含 toolchain-*），使 Check Caches
          # 恢复的 toolchain cache 完全失效（每次编译白重建 toolchain 约 20~30 分钟）。
          # 改为只清理 host 工具目录与 tmp（保证 sed 等 host 工具重建），保留
          # toolchain。make tools/install 在 host 工具已就位时会快速跳过。
          rm -rf ./staging_dir/host ./tmp
          make tools/install -j$(nproc)

      - name: Rust Cache Key
        # 缓存键只依赖 Cargo.lock：只改业务代码、不改依赖树的重复构建，
        # cargo 命中 registry/git 索引与 target 目录后只重编 crate 自身，
        # 不再整棵 Tokio + rustls + ring 依赖树重来。
        # 用 Cargo.lock 的 sha256 而非 commit hash：后者每次 push 都变，
        # 会把缓存命中率压到接近 0。
        id: rust-cache-key
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          LOCK=package/luci-app-mt5700/src/rust/Cargo.lock
          if [ ! -f "$LOCK" ]; then
            echo "::error::$LOCK 不存在（Custom Packages 未成功？），无法计算 Rust 缓存键"
            exit 1
          fi
          RUST_LOCK_HASH=$(sha256sum "$LOCK" | cut -c1-24)
          echo "RUST_LOCK_HASH=$RUST_LOCK_HASH" >> "$GITHUB_ENV"
          echo "rust_lock_hash=$RUST_LOCK_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Rust Cache
        id: rust-cache
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: rust-mt5700-${{env.RUST_LOCK_HASH}}
          restore-keys: |
            rust-mt5700-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/mt5700-target

      - name: Cross Compile Rust Backend for luci-app-mt5700
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          ARCH_PACKAGES=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/\1/p' .config | head -1)
          if [ -z "$ARCH_PACKAGES" ]; then
            echo "::error::.config 未解析出 CONFIG_TARGET_ARCH_PACKAGES"
            exit 1
          fi
          case "$ARCH_PACKAGES" in
            aarch64_cortex-a53)
              RUST_TARGET=aarch64-unknown-linux-musl
              ZIG_TARGET=aarch64-linux-musl
              ;;
            *)
              echo "::error::本步骤仅覆盖 aarch64_cortex-a53，当前 $ARCH_PACKAGES"
              exit 1
              ;;
          esac
          echo "Rust 目标：$RUST_TARGET（ARCH_PACKAGES=$ARCH_PACKAGES）"

          if ! command -v cargo >/dev/null 2>&1; then
            # 先落盘再执行：curl 卡住或证书失败时，管道喂给 sh 的是空内容，
            # sh 会以 0 退出，缺工具链要到几小时后 cargo 阶段才暴露。
            curl -sSf --retry 3 --connect-timeout 30 --max-time 120 \
              https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
          fi
          # target 标准库约 200MB，rustup 无内置下载超时；慢速挂起时收束并重试一次
          timeout --kill-after=30 900 rustup target add "$RUST_TARGET" \
            || timeout --kill-after=30 900 rustup target add "$RUST_TARGET"
          cargo --version
          rustc --version

          python3 -m venv /tmp/zig-venv
          # PyPI 链路也可能慢速挂起：pip 自带超时与重试，收束单次下载
          /tmp/zig-venv/bin/pip install --quiet --timeout 60 --retries 3 "ziglang==0.13.0"
          ZIG="$(/tmp/zig-venv/bin/python -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          chmod +x "$ZIG"
          "$ZIG" version

          export ZIG ZIG_TARGET
          mkdir -p /tmp/zig-wrap
          cat > /tmp/zig-wrap/zig-cc <<'WRAP'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
            case "$a" in
              --target=*|*--fix-cortex-a53*) ;;
              *) args+=("$a") ;;
            esac
          done
          exec "$ZIG" cc -target "$ZIG_TARGET" "${args[@]}"
          WRAP
          cat > /tmp/zig-wrap/zig-ar <<'WRAP'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
            case "$a" in
              --target=*) ;;
              *) args+=("$a") ;;
            esac
          done
          exec "$ZIG" ar "${args[@]}"
          WRAP
          chmod +x /tmp/zig-wrap/zig-cc /tmp/zig-wrap/zig-ar

          cd package/luci-app-mt5700/src/rust
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/zig-wrap/zig-cc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_AR=/tmp/zig-wrap/zig-ar
          export CC_aarch64_unknown_linux_musl=/tmp/zig-wrap/zig-cc
          export AR_aarch64_unknown_linux_musl=/tmp/zig-wrap/zig-ar
          # target-cpu=cortex-a53 与固件 ARCH_PACKAGES=aarch64_cortex-a53 对齐
          # （OpenWrt 官方软件包同样以 cortex-a53 为基线）；-C link-self-contained=no
          # 让 zig cc 提供 libc 与启动对象。
          export RUSTFLAGS="-C link-self-contained=no -C target-cpu=cortex-a53"
          # Tokio + rustls + ring 依赖树的下载与 zig 链接最重，挂起时收束并重试一次
          CARGO_TARGET_DIR=/tmp/mt5700-target timeout --kill-after=60 1800 \
            cargo build --release --locked --target "$RUST_TARGET" \
            || CARGO_TARGET_DIR=/tmp/mt5700-target timeout --kill-after=60 1800 \
            cargo build --release --locked --target "$RUST_TARGET"

          BIN="/tmp/mt5700-target/$RUST_TARGET/release/at-webserver"
          file "$BIN"
          file "$BIN" | grep -q 'ARM aarch64' || { echo "::error::后端不是 aarch64 ELF"; exit 1; }
          file "$BIN" | grep -q 'statically linked' || { echo "::error::后端不是静态链接"; exit 1; }
          readelf -d "$BIN" | grep -q 'no dynamic section' || {
            echo "::error::后端带动态段"
            readelf -d "$BIN"
            exit 1
          }
          BIN_SIZE=$(stat -c %s "$BIN")
          if [ "$BIN_SIZE" -lt 1000000 ]; then
            echo "::error::后端体积异常（$BIN_SIZE 字节）"
            exit 1
          fi

          mkdir -p ../prebuilt
          cp -f "$BIN" ../prebuilt/at-webserver
          chmod 0755 ../prebuilt/at-webserver
          ls -l ../prebuilt/
          echo "luci-app-mt5700 预编译后端就绪：$BIN_SIZE 字节"

      - name: Save Rust Cache
        # 只在交叉编译成功后保存：失败时 /tmp/mt5700-target 可能不完整，
        # 保存后下次 restore 会混入损坏的 .rlib。cargo fingerprint 能处理多数
        # 情况，但链接阶段被 SIGKILL 的极端场景不保证。
        if: ${{ success() && !inputs.WRT_TEST && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: rust-mt5700-${{env.RUST_LOCK_HASH}}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/mt5700-target

      - name: Download Packages
        id: download-packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          # 2026-11-07 事故：源码包镜像「连上但吞吐趋零」，本步拖了 77 分钟
          # 直至 runner 被环境回收、日志未上传。download.pl 的镜像轮换只在连接
          # 失败时触发，慢速挂起必须用 timeout 强制收束。源码包先落 tmp/dl、
          # 校验哈希通过才进 dl/，中断不留损坏文件。
          if ! timeout --kill-after=60 900 make download -j$(nproc); then
            echo "==> 并发下载超时或失败，降级 -j1 逐文件重试（轮换镜像源）"
            timeout --kill-after=60 1800 make download -j1 V=s
          fi

      - name: Save Build Cache (Download Packages)
        # dl 是独立资源：Download Packages 成功后即使后续编译失败也应保存；
        # 用 outcome 检查而非 success()，避免编译失败连带丢弃已下载的源码包。
        if: ${{ always() && !inputs.WRT_TEST && steps.download-packages.outcome == 'success' && steps.cache-dl-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-dl-${{env.WRT_HASH}}
          path: |
            ./wrt/dl

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          export CCACHE_DIR="$(pwd)/.ccache"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=true
          ccache -z 2>/dev/null || true

          set +e
          set -o pipefail
          : > build.log

          # 2026-11-09 run 130 复盘：Cache-Clean 在周日删掉全部缓存，两个作业都从零
          # 开始，首轮 90 分钟在 toolchain/gcc/final 被 SIGTERM；降级命令 `make -j1 V=s`
          # 把 4 核并行改成单线程，又空烧 120 分钟仍停在同一处，最终 step 以 124 退出。
          # 冷编译实测需要 4 小时以上，旧的双重超时（90 + 120 分钟）与 345 分钟 job
          # 上限都不可能完成；而 -j1 不是「续编」而是把剩余工作放大数倍。
          #
          # 改为「自适应总预算 + 等长分片续编」：
          #   - 每个分片 45 分钟，始终 -j$(nproc)：超时只中断当前分片，不是整轮构建；
          #   - make 幂等，分片之间从断点继续，损失仅为被 SIGTERM 打断的个别编译单元；
          #   - 总预算上限 300 分钟（冷编译实测的量级），并从前置步骤耗时中扣除，
          #     保证 job 总时长不超过 345 分钟上限（留 10 分钟给打包与发布）；
          #   - 冷编译成功后新缓存会被写回，后续运行回到 40 分钟量级。
          JOB_CAP=20100    # 335 分钟：345 分钟 job 上限减 10 分钟给后续步骤
          MAX_BUDGET=18000 # 300 分钟：冷编译预算上限
          if [ -n "${JOB_START_EPOCH:-}" ]; then
            elapsed=$(( $(date +%s) - JOB_START_EPOCH ))
          else
            elapsed=900
          fi
          budget=$(( JOB_CAP - elapsed ))
          if [ "$budget" -lt 3600 ]; then
            echo "::error::job 已耗时 $((elapsed / 60)) 分钟，剩余预算不足 60 分钟，无法完成编译"
            exit 1
          fi
          if [ "$budget" -gt "$MAX_BUDGET" ]; then budget=$MAX_BUDGET; fi
          echo "==> 编译预算 $((budget / 60)) 分钟（job 已耗时 $((elapsed / 60)) 分钟）"
          DEADLINE=$(( $(date +%s) + budget ))
          CHUNK=2700
          attempt=0
          fast_fail=0
          RC=1
          while :; do
            attempt=$((attempt + 1))
            remain=$(( DEADLINE - $(date +%s) ))
            if [ "$remain" -le 60 ]; then
              echo "::error::固件编译用尽 ${budget} 秒总预算仍未完成（已尝试 ${attempt} 次）"
              RC=1
              break
            fi
            slice=$CHUNK
            if [ "$remain" -lt "$slice" ]; then slice=$remain; fi
            echo "==> 编译分片 #${attempt}：${slice}s，剩余预算 $((remain / 60)) 分钟，-j$(nproc)"
            timeout --kill-after=60 "$slice" make -j$(nproc) 2>&1 | tee -a build.log
            RC=${PIPESTATUS[0]}
            if [ "$RC" -eq 0 ]; then
              echo "==> 固件编译完成（分片 #${attempt}）"
              break
            elif [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
              fast_fail=0
              echo "==> 分片 #${attempt} 超时（rc=$RC），从断点续编"
            else
              fast_fail=$((fast_fail + 1))
              echo "==> 分片 #${attempt} 失败（rc=$RC），连续非超时失败 ${fast_fail} 次"
              if [ "$fast_fail" -ge 2 ]; then
                echo "::error::连续 ${fast_fail} 次非超时失败（rc=$RC），判定为真实编译错误，终止"
                break
              fi
            fi
          done

          if [ "$RC" -ne 0 ]; then
            echo "::group::编译失败诊断"
            ANN=$(mktemp)
            : > "$ANN"

            grep -E "ERROR: .*(trying to overwrite|unable to select packages|package version is invalid|breaks:|conflicts with|installed .* is newer)" build.log \
              | sort -u | head -n 6 >> "$ANN" || true
            grep -E "^(ERROR: |make(\\[[0-9]+\\])?: \*\*\* ).*(failed to build|Error [0-9]|too big)" build.log \
              | sort -u | head -n 4 >> "$ANN" || true
            grep -E "^make(\\[[0-9]+\\])?: \*\*\* .*(Error [0-9]|Stop)" build.log \
              | sort -u | head -n 4 >> "$ANN" || true

            if [ ! -s "$ANN" ]; then
              grep -E "^ERROR: " build.log | sort -u | head -n 8 >> "$ANN" || true
            fi

            if [ ! -s "$ANN" ]; then
              echo "::error::未匹配到包级错误行，输出日志末尾 30 行"
              tail -n 30 build.log
            else
              awk '!seen[$0]++' "$ANN" | head -n 12 | while IFS= read -r LINE; do
                [ -n "$LINE" ] && echo "::error::$LINE"
              done
              echo "--- 编译错误上下文 ---"
              grep -nE "error:|Error [0-9]+|collect2:|undefined reference|too big|trying to overwrite|unable to select packages|package version is invalid|breaks:" build.log \
                | head -n 30
            fi
            rm -f "$ANN"
            echo "::endgroup::"
          fi

          ccache -s 2>/dev/null || true
          exit "$RC"

      - name: Save Build Cache (Toolchain & ccache)
        # 只在编译成功后保存：失败时 toolchain 可能不完整，保存后下次 restore
        # 会混入半成品，反而让后续构建在更隐蔽的位置失败。
        if: ${{ success() && !inputs.WRT_TEST && steps.check-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/tool*
            ./wrt/staging_dir/host*

      - name: Machine Information
        run: |
          cd ./wrt/
          lscpu | grep -E "name|Core|Thread"
          df -h
          du -h --max-depth=1

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/
          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} + || true

            SAFE_NAME=$(echo "$WRT_NAME"   | tr '/ ' '__')
            SAFE_INFO=$(echo "$WRT_INFO"   | tr '/ ' '__')
            SAFE_BRANCH=$(echo "$WRT_BRANCH" | tr '/ ' '__')
            SAFE_TARGET=$(echo "$WRT_TARGET" | tr '/ ' '__')
            SAFE_WIFI="$WRT_WIFI"
            [ "$SAFE_WIFI" = "none" ] && SAFE_WIFI=""
            SAFE_DATE="$WRT_DATE"

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              BASE=$(basename "$FILE")
              case "$BASE" in
                *.bin|*.img|*.gz|*.vmdk) ;;
                *) mv -f "$FILE" "./upload/$BASE"; continue ;;
              esac
              EXT=$(echo "$BASE" | cut -d '.' -f 2-)
              STEM="${BASE%.*}"
              case "$STEM" in
                *sysupgrade*)   TYPE=sysupgrade ;;
                *factory*)      TYPE=factory ;;
                *initramfs*)    TYPE=initramfs ;;
                *recovery*)     TYPE=recovery ;;
                *combined-efi*) TYPE=efi ;;
                *combined*)     TYPE=combined ;;
                *rootfs*)       TYPE=rootfs ;;
                *kernel*)       TYPE=kernel ;;
                *)              TYPE="" ;;
              esac

              PARTS=()
              [ -n "$SAFE_NAME" ]   && PARTS+=("$SAFE_NAME")
              [ -n "$SAFE_INFO" ]   && PARTS+=("$SAFE_INFO")
              [ -n "$SAFE_BRANCH" ] && PARTS+=("$SAFE_BRANCH")
              [ -n "$SAFE_TARGET" ] && PARTS+=("$SAFE_TARGET")
              [ -n "$SAFE_WIFI" ]   && PARTS+=("$SAFE_WIFI")
              [ -n "$TYPE" ]        && PARTS+=("$TYPE")
              NEW_BASE=$(IFS='-'; echo "${PARTS[*]}")
              NEW_BASE="$NEW_BASE-$SAFE_DATE"

              NEW_FILE="$NEW_BASE.$EXT"
              if [ -e "./upload/$NEW_FILE" ]; then
                FS=$(echo "$STEM" | grep -ioE 'squashfs|ext4' | tail -n 1 || true)
                if [ -n "$FS" ] && [ ! -e "./upload/$NEW_BASE-$FS.$EXT" ]; then
                  NEW_FILE="$NEW_BASE-$FS.$EXT"
                else
                  SUFFIX=$(echo "$BASE" | md5sum | cut -c 1-6)
                  NEW_FILE="$NEW_BASE-$SUFFIX.$EXT"
                fi
              fi
              mv -f "$FILE" "./upload/$NEW_FILE"
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \; || true
            rm -rf ./build_dir ./bin
          fi

      - name: Release Firmware
        if: ${{ !inputs.WRT_TEST }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}"

          BODY=$(cat <<EOF
          这是个平台固件包，内含多个设备！
          请注意选择你需要的设备固件！
          不要问，刷就完事了！

          全系带开源硬件加速，别问了！

          源码：${{env.WRT_REPO}}
          分支：${{env.WRT_BRANCH}}
          提交：${{env.WRT_HASH}}

          配置：${{env.WRT_CONFIG}}
          平台：${{env.WRT_TARGET}}

          登录地址：${{env.WRT_IP}}
          登录密码：${{env.WRT_PW}}

          WIFI名称：${{env.WRT_SSID}}
          WIFI密码：${{env.WRT_WORD}}

          内核版本：${{env.WRT_KVER}}
          插件列表：${{env.WRT_LIST}}

          MT5700 插件版本：${{env.MT5700_VERSION}}
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在（$TAG），追加产物"
          else
            gh release create "$TAG" --notes "$BODY"
          fi

          for f in ./wrt/upload/*.*; do
            [ -f "$f" ] || continue
            attempt=0
            until gh release upload --clobber "$TAG" "$f"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then
                echo "::error::上传失败（已重试 5 次）：$f"
                exit 1
              fi
              echo "上传 $f 失败（第 ${attempt} 次，5s 后重试）..."
              sleep 5
            done
          done

      - name: Upload Build Log on Failure
        # 编译失败时保留完整日志：runner 被环境回收后（2026-11-06 事故）
        # job 日志端点会返回 404，只有 artifact 能留下来复盘。
        if: failure() && env.WRT_TEST != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.WRT_CONFIG }}-${{ env.WRT_DATE }}
          path: ./wrt/build.log
          if-no-files-found: warn
          retention-days: 7

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail
          # WRT_CACHE_KEY = prefix-hash（hash 为固件仓库的完整 commit）。
          # 旧逻辑误用 GITHUB_SHA（触发 workflow 的 commit），与固件 commit 不同，
          # CURRENT_*_KEYS 永远为空，rollover 永远不执行 → 旧 cache 不清，
          # 撞 10GB 配额后 Save Build Cache 静默失败。
          KEY_SUFFIX="${WRT_CACHE_KEY##*-}"

          CURRENT_TC_KEYS=$(gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-${KEY_SUFFIX}" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          if [ -n "$CURRENT_TC_KEYS" ]; then
            gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
              while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
                [ -n "$CACHE_ID" ] || continue
                [[ "$CACHE_KEY" == *"${KEY_SUFFIX}"* ]] && continue
                gh cache delete "$CACHE_ID" --repo "$GH_REPO" || echo "warning: failed to delete cache $CACHE_ID"
              done
          fi

          CURRENT_DL_KEYS=$(gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-dl-${KEY_SUFFIX}" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          if [ -n "$CURRENT_DL_KEYS" ]; then
            gh cache list --repo "$GH_REPO" --key "${WRT_CACHE_PREFIX}-dl-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
              while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
                [ -n "$CACHE_ID" ] || continue
                [[ "$CACHE_KEY" == *"${KEY_SUFFIX}"* ]] && continue
                gh cache delete "$CACHE_ID" --repo "$GH_REPO" || echo "warning: failed to delete cache $CACHE_ID"
              done
          fi

      - name: Roll Rust Cache
        # rust-mt5700-<lock_hash> 不在 WRT_CACHE_PREFIX 命名空间内，
        # 不由上一步清理；这里只保留当前 Cargo.lock 哈希对应的那一代。
        env:
          RUST_LOCK_HASH: ${{needs.core.outputs.rust_lock_hash}}
        run: |
          set -euo pipefail
          if [ -z "${RUST_LOCK_HASH:-}" ]; then
            echo "no rust_lock_hash output, skip rust cache rollover"
            exit 0
          fi
          gh cache list --repo "$GH_REPO" --key "rust-mt5700-" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [[ "$CACHE_KEY" == *"${RUST_LOCK_HASH}"* ]] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" || echo "warning: failed to delete rust cache $CACHE_ID"
            done
