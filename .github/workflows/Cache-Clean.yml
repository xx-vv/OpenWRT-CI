# SPDX-License-Identifier: MIT

name: 缓存清理

on:
  # 取消定时清理（避免每周触发冷启动导致编译时间翻倍），改为仅手动触发。
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7

      - name: 清理 Actions 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">>> 开始清理全部 Actions 缓存..."
          gh cache delete --all || true
          echo "=== 缓存清理完成 ==="
